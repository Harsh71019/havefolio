name: havefolio
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  tmpfs: ['/tmp:size=128m,mode=1777']
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }
services:
  migrate:
    image: havefolio-migration:${RELEASE:?Set RELEASE}
    env_file: /opt/havefolio/secrets/shared-services/.env.production.migration
    networks: [shared-services]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: node
  api:
    <<: *runtime
    image: havefolio-api:${RELEASE:?Set RELEASE}
    env_file: /opt/havefolio/secrets/shared-services/.env.production.api
    networks: [app, shared-services]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  worker:
    <<: *runtime
    image: havefolio-worker:${RELEASE:?Set RELEASE}
    env_file: /opt/havefolio/secrets/shared-services/.env.production.worker
    networks: [shared-services]
    mem_limit: 256m
    cpus: 0.5
  web:
    <<: *runtime
    image: havefolio-web:${RELEASE:?Set RELEASE}
    networks: [app]
    ports: ['127.0.0.1:3020:3000']
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  app:
  shared-services:
    external: true
